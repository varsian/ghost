name: Bug report
description: Report a problem with GHOST Community Edition
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem with GHOST Community Edition.

        Before submitting:
        - search existing issues and read the docs in `docs/` (and the component docs);
        - **do not attach secrets, tokens, local absolute paths, personal information,
          Live2D model files, voice/reference audio or VoxCPM weights**;
        - security vulnerabilities must **not** be reported here — follow `SECURITY.md`
          (GitHub private vulnerability reporting) instead.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the stack is affected?
      options:
        - live2d-pet (Live2D desktop pet)
        - tts-bridge (Live2D x TTS playback bridge)
        - voice-plugin (VoxCPM 1.5 TTS plugin snapshot)
        - docs / scripts / repository tooling
        - not sure
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: install-mode
    attributes:
      label: How is GHOST installed?
      options:
        - Desktop DSH profile (install.ps1)
        - Dev DSH instance (DSH_HOME / dev-start.ps1)
        - Manually linked / custom setup
        - Not installed yet (build or test-only problem)
        - not sure
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness (DSH) version
      description: The DSH release or commit you are running.
      placeholder: "e.g. 0.x.y desktop build, or dev commit <sha>"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v22.x.x"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version` (the interpreter used for the TTS engine).
      placeholder: "3.12.x"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem and its impact.
      placeholder: What did you expect, and what did the stack actually do?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that reliably shows the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs and diagnostics
      description: |
        Paste the relevant portion of logs (for example the plugin `data/` log or the
        Python daemon output). **Redact local paths, tokens and personal data.** Do not
        attach Live2D models, textures, voice/reference audio, VoxCPM weights or secrets.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the documentation before filing this report.
          required: true
        - label: This report contains no secrets, tokens, local absolute paths or personal information.
          required: true
        - label: This report contains no Live2D model files, voice/reference audio or VoxCPM weights.
          required: true
        - label: I understand that security vulnerabilities must be reported privately as described in SECURITY.md, not in a public issue.
          required: true
