<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSH Live2D</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        /* HARD REQUIREMENT: the window is a transparent PNG-like overlay */
        background: transparent !important;
        overflow: hidden;
      }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #e8e8ee;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      /* canvas host: exactly the window, nothing else.
         The WHOLE surface drags the window (Electron app-region); the model has
         no click interactions, so this is the only pointer behaviour we need. */
      #stage {
        position: fixed;
        inset: 0;
        background: transparent;
        border: none;
        overflow: visible;
        -webkit-app-region: drag;
      }
      #stage canvas {
        display: block;
        background: transparent !important;
      }
      /* Close / minimize affordances: nothing visible normally. The mouse
         entering the top-right hotspot reveals large, easy-to-click buttons
         (the hotspots are no-drag so they receive hover and click events). */
      #close-hotspot {
        position: fixed;
        top: 0;
        right: 0;
        width: 56px;
        height: 56px;
        z-index: 2147483001;
        -webkit-app-region: no-drag;
        pointer-events: auto;
        background: transparent;
      }
      #min-hotspot {
        position: fixed;
        top: 0;
        right: 52px;
        width: 56px;
        height: 56px;
        z-index: 2147483001;
        -webkit-app-region: no-drag;
        pointer-events: auto;
        background: transparent;
      }
      #close-btn,
      #min-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.45);
        background: rgba(24, 24, 30, 0.78);
        color: #fff;
        font: 19px/28px system-ui, sans-serif;
        text-align: center;
        cursor: pointer;
        opacity: 0;
        transform: scale(0.92);
        transition: opacity 140ms ease, transform 140ms ease, background 140ms ease;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      }
      #min-btn {
        font: 17px/26px system-ui, sans-serif;
      }
      #close-hotspot:hover #close-btn,
      #close-hotspot:focus-within #close-btn,
      #min-hotspot:hover #min-btn,
      #min-hotspot:focus-within #min-btn {
        opacity: 1;
        transform: scale(1);
      }
      #close-btn:hover {
        background: rgba(214, 60, 60, 0.92);
        border-color: rgba(255, 255, 255, 0.75);
      }
      #min-btn:hover {
        background: rgba(70, 130, 220, 0.92);
        border-color: rgba(255, 255, 255, 0.75);
      }
      #close-btn:active,
      #min-btn:active {
        transform: scale(0.96);
      }
      /* Resize grip: ALWAYS visible (subtle) so it is discoverable, brighter on
         hover. Dragging it resizes the frameless Electron window via the preload
         bridge (no native frame means no OS resize borders). */
      #resize-grip {
        position: fixed;
        right: 4px;
        bottom: 4px;
        width: 30px;
        height: 30px;
        border-radius: 7px;
        z-index: 2147483002;
        -webkit-app-region: no-drag;
        cursor: nwse-resize;
        opacity: 0.6;
        transition: opacity 160ms ease, background 160ms ease;
        background-color: rgba(24, 24, 30, 0.55);
        background-image: linear-gradient(
          135deg,
          transparent 0 46%,
          rgba(255, 255, 255, 0.75) 46% 51%,
          transparent 51% 60%,
          rgba(255, 255, 255, 0.75) 60% 65%,
          transparent 65%
        );
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
      }
      #resize-grip:hover {
        opacity: 1;
        background-color: rgba(60, 120, 190, 0.85);
      }
      /* Small bubble above the grip, shown on startup so nobody has to guess. */
      #resize-hint {
        position: fixed;
        right: 6px;
        bottom: 40px;
        padding: 4px 9px;
        border-radius: 7px;
        font: 11px/16px system-ui, sans-serif;
        color: rgba(240, 240, 250, 0.95);
        background: rgba(24, 24, 30, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.18);
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition: opacity 260ms ease;
        z-index: 2147483002;
      }
      #resize-hint.show {
        opacity: 1;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        max-width: 92vw;
        padding: 4px 12px;
        border-radius: 999px;
        font: 11px/16px system-ui, sans-serif;
        color: rgba(235, 235, 245, 0.9);
        background: rgba(20, 20, 26, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.14);
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition: opacity 300ms ease;
        z-index: 2147482999;
      }
      #hint.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="close-hotspot" title="悬停显示关闭按钮">
      <button id="close-btn" title="关闭窗口（Esc）" aria-label="关闭">×</button>
    </div>
    <div id="min-hotspot" title="悬停显示最小化按钮">
      <button id="min-btn" title="最小化到任务栏" aria-label="最小化">—</button>
    </div>
    <div id="hint">拖动任意位置移动窗口 · 右下角拖动调整大小 · 右上角悬停出现最小化/关闭按钮（Esc 也可关闭）</div>
    <div id="resize-grip" title="按住拖动调整窗口大小"></div>
    <div id="resize-hint">拖动这里调整大小 ↘</div>

    <script>
      /**
       * Load the self-contained window bundle (vendor + renderer + SSE glue).
       * The DSH host serves the plugin root; the launcher may also serve the
       * bundle next to this page. Try the common locations in order.
       */
      (function () {
        var candidates = ['/lib/window.js', '/window.js', '../lib/window.js', './window.js'];
        var i = 0;
        function next() {
          if (i >= candidates.length) {
            var hint = document.getElementById('hint');
            if (hint) {
              hint.textContent = '加载 lib/window.js 失败（请确认 host 已 serve 插件根目录）';
              hint.classList.add('show');
            }
            return;
          }
          var src = candidates[i++];
          var s = document.createElement('script');
          s.src = src;
          s.async = false;
          s.onload = function () {};
          s.onerror = function () {
            s.remove();
            next();
          };
          document.body.appendChild(s);
        }
        next();

        // The right-top × always closes this Electron window, whatever state the
        // renderer is in (window.close() closes the host BrowserWindow).
        function closeWindow() {
          try {
            if (globalThis.dshLive2DWindow && typeof globalThis.dshLive2DWindow.close === 'function') {
              globalThis.dshLive2DWindow.close();
              return;
            }
            if (typeof globalThis.__DSH_LIVE2D_WINDOW_CLOSE__ === 'function') {
              globalThis.__DSH_LIVE2D_WINDOW_CLOSE__();
              return;
            }
          } catch { /* fall through */ }
          window.close();
        }
        document.getElementById('close-btn').addEventListener('click', closeWindow);

        // The right-top — minimises the window to the taskbar (normal-window mode).
        function minimizeWindow() {
          try {
            if (globalThis.dshLive2DWindow && typeof globalThis.dshLive2DWindow.minimize === 'function') {
              globalThis.dshLive2DWindow.minimize();
              return;
            }
            if (typeof globalThis.__DSH_LIVE2D_WINDOW_MINIMIZE__ === 'function') {
              globalThis.__DSH_LIVE2D_WINDOW_MINIMIZE__();
            }
          } catch { /* ignore */ }
        }
        document.getElementById('min-btn').addEventListener('click', minimizeWindow);
        window.addEventListener('keydown', function (event) {
          if (event.key === 'Escape') closeWindow();
        });

        // ---------------------------------------------------------- resize grip
        // Frameless + transparent windows have no OS resize border, so a small
        // bottom-right grip drives the preload bridge's resizeTo().
        (function () {
          var grip = document.getElementById('resize-grip');
          if (!grip) return;
          var resizing = false;
          var startX = 0;
          var startY = 0;
          var startWidth = window.innerWidth;
          var startHeight = window.innerHeight;
          var bridge = globalThis.dshLive2DWindow;
          grip.addEventListener('pointerdown', function (event) {
            resizing = true;
            startX = event.screenX;
            startY = event.screenY;
            startWidth = window.innerWidth;
            startHeight = window.innerHeight;
            try { grip.setPointerCapture(event.pointerId); } catch { /* ignore */ }
            event.preventDefault();
            event.stopPropagation();
            document.body.style.cursor = 'nwse-resize';
            if (bridge && typeof bridge.getBounds === 'function') {
              Promise.resolve(bridge.getBounds()).then(function (bounds) {
                if (bounds && resizing) {
                  startWidth = bounds.width;
                  startHeight = bounds.height;
                }
              }).catch(function () {});
            }
          });
          window.addEventListener('pointermove', function (event) {
            if (!resizing) return;
            var nextWidth = Math.max(160, startWidth + (event.screenX - startX));
            var nextHeight = Math.max(200, startHeight + (event.screenY - startY));
            if (bridge && typeof bridge.resizeTo === 'function') bridge.resizeTo(nextWidth, nextHeight);
            else if (typeof window.resizeTo === 'function') window.resizeTo(nextWidth, nextHeight);
          });
          window.addEventListener('pointerup', function () {
            if (!resizing) return;
            resizing = false;
            document.body.style.cursor = '';
          });
        })();
        // Fade the drag/close hint after a few seconds; the grip bubble stays a
        // little longer so "how do I resize" is answered without reading docs.
        var hint = document.getElementById('hint');
        hint.classList.add('show');
        setTimeout(function () { hint.classList.remove('show'); }, 8000);
        var resizeHint = document.getElementById('resize-hint');
        if (resizeHint) {
          resizeHint.classList.add('show');
          setTimeout(function () { resizeHint.classList.remove('show'); }, 12000);
        }
      })();
    </script>
  </body>
</html>
